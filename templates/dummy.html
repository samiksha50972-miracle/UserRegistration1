<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}
    <title>Document</title>
    {% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <nav class="navbar bg-warning">
        <div class="container-fluid">
            
            {% if user.is_authenticated %}
<a href="{% url 'register' %} " class="navbar-brand text-black" >registration</a>
            <a href="{% url 'home' %} " class="navbar-brand text-black" >home</a>
            <a href="{% url 'user_login' %} " class="navbar-brand text-black" >login</a>
            <a href="{% url 'userlogout' %}" class="navbar-brand text-black">logout</a>
            <a href="{% url 'display_user_details' %}" class="navbar-brand text-black" >displayUser</a>
            <a href="{% url 'changePassword' %}" class="navbar-brand text-black" >changePassword</a>

            {% else %}
            <a href="{% url 'register' %} " class="navbar-brand text-black" >registration</a>
            <a href="{% url 'home' %} " class="navbar-brand text-black" >home</a>
            <a href="{% url 'user_login' %} " class="navbar-brand text-black" >login</a>
            <a href="{% url 'resetPassword' %} " class="navbar-brand text-black">resetPassword</a>
            {% endif %}
            </div>
    </nav>

    {% block content %}

    {% endblock %}
    
</body>
</html>
