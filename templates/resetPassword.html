{% extends 'dummy.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% block content %}
    <center>
        <form action="{% url 'save_password' %}" method="POST">
            {% csrf_token %}
            <label for="username">username</label>
            <input type="text" name="username" id="" value="{{UO.username}}">
            <br> <br>
            <label for="rpwd">Reset-Password</label>
            <input type="password" name="rpwd" id="" class="">
            <br> <br>
            <label for="cp">Confirm password</label>
            <input type="password" name="cp" id="">
            <br> <br>
            <input type="submit" value="ResetPassword" class="btn btn-danger">
        </form>
    </center>
    {% endblock %}
    
</body>
</html>
